<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Crew Rest">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Crew Rest Calculator</title>
<style>
  /* Day: positive polarity (dark on light) for bright flight deck. Night: mirrors day - neutral
     surfaces with the same blue accents, dimmed (moderate contrast, less glare). */
  :root, [data-theme="day"] {
    --bg: #eef2f6; --card: #ffffff; --line: #d5dce4; --text: #0b0f14; --muted: #4f5b67;
    --input: #f4f6f8; --btn: #e8edf2; --accent: #0b57d0; --on-accent: #ffffff;
    --seg-on: #0b57d0; --seg-on-text: #ffffff; --warn: #b3261e;
    --r1: #85b7eb; --r2: #2a74c6; --r3: #185fa5; --pp: #d3dae2; --cur: #0b0f14; --tag-text: #ffffff;
    --r1t: #042c53; --r2t: #ffffff; --r3t: #ffffff;
    --now-bg: #0b57d0; --now-text: #ffffff; --now-sub: #d6e6fb; --hl: #e6f1fb;
    --shadow: 0 1px 2px rgba(15,30,50,.06), 0 4px 16px rgba(15,30,50,.07); --cardline: transparent;
    --call: #9a5b00; --call-ic: #c27400; --bad-bg: #fdeceb;
  }
  [data-theme="night"] {
    --bg: #0f1216; --card: #181c22; --line: #2b3139; --text: #e2e6eb; --muted: #99a2ad;
    --input: #0f1216; --btn: #222830; --accent: #2f6fd0; --on-accent: #f1f5fb;
    --seg-on: #2f6fd0; --seg-on-text: #f1f5fb; --warn: #f08a7a;
    --r1: #8bb8ea; --r2: #3478c8; --r3: #2a62ad; --pp: #2b3139; --cur: #f1f5fb; --tag-text: #0f1216;
    --r1t: #0d2747; --r2t: #ffffff; --r3t: #eaf1fb;
    --now-bg: #2457a8; --now-text: #f4f7fb; --now-sub: #cfe0f7; --hl: #1f2b3d;
    --shadow: none; --cardline: #2b3139;
    --call: #f2b85a; --call-ic: #e9a93f; --bad-bg: #2a1716;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 14px)
    calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 14px); }
  .num { font-variant-numeric: tabular-nums; }

  header { position: relative; padding: 0 52px; margin-bottom: 16px; }
  h1 { text-align: center; font-size: 17px; letter-spacing: .5px; white-space: nowrap; margin: 6px 0; font-weight: 700; }
  .theme { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--cardline); background: var(--card); color: var(--text); box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center; padding: 0; }
  .theme .ic { margin: 0; width: 20px; height: 20px; }

  /* Kip the koala: blinks and smiles; looks at his watch 10 min before a call; says CALL! until tapped */
  .kip { position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; padding: 0;
    border: 0; background: transparent; z-index: 5; -webkit-appearance: none; appearance: none; overflow: visible; }
  .kip svg { position: absolute; left: 0; top: 0; width: 44px; height: 44px; display: block; overflow: visible; }
  .k-eyes { transform-box: fill-box; transform-origin: center; transition: transform .09s; }
  .kip.blink .k-eyes { transform: scaleY(.12); }
  .k-m2 { display: none; } .kip.smile .k-m1 { display: none; } .kip.smile .k-m2 { display: inline; }
  .k-arm { opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .3s; }
  .kip.k-watch .k-arm { opacity: 1; transform: none; animation: kipWrist 2.4s ease-in-out infinite; }
  .kip.k-watch .k-eyes { transform: translate(-2px, 2px); }
  .kbub { position: absolute; left: 30px; top: 40px; background: #f2b85a; color: #3b2300; font-size: 13px; font-weight: 800;
    letter-spacing: .5px; padding: 3px 8px; border-radius: 9px; white-space: nowrap; display: none; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .kbub::before { content: ""; position: absolute; left: 6px; top: -6px; border: 6px solid transparent; border-top: 0; border-bottom-color: #f2b85a; }
  .kip.k-call .kbub { display: block; animation: kipBounce 1.2s ease-in-out infinite; }
  .kip.k-call .k-m1 { display: none; } .kip.k-call .k-m2 { display: inline; }
  @keyframes kipWrist { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
  @keyframes kipBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) {
    .kip .k-eyes, .k-arm { transition: none; } .kip.k-watch .k-arm, .kip.k-call .kbub { animation: none; }
  }

  .wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--cardline); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
  .card h2 { font-size: 12px; letter-spacing: 1px; color: var(--muted); margin: 0 0 12px; font-weight: 600; text-transform: uppercase; }
  .ic { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    vertical-align: -0.28em; margin-left: 6px; flex: none; }

  /* Now card */
  .now { background: var(--now-bg); color: var(--now-text); border-radius: 18px; padding: 16px; text-align: center; box-shadow: var(--shadow); }
  .now .l1 { font-size: 15px; color: var(--now-sub); font-weight: 600; letter-spacing: .3px; }
  .now .l2 { font-size: 34px; font-weight: 800; line-height: 1.15; margin: 2px 0; }
  .now .l3 { font-size: 15px; color: var(--now-sub); }

  /* Inputs */
  label.f { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; letter-spacing: 1px; font-weight: 600; }
  .field { margin-bottom: 16px; }
  .inbox { position: relative; }
  .inbox input { width: 100%; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 10px 40px 10px 14px;
    background: var(--input); color: var(--text); border: 1px solid var(--line); border-radius: 12px; outline: none; }
  .inbox input:focus { border-color: var(--accent); }
  .inbox input.bad, .inbox input.bad:focus { border-color: var(--warn); box-shadow: 0 0 0 1.5px var(--warn); background: var(--bad-bg); }
  .inbox .sfx { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 22px; color: var(--muted); pointer-events: none; }
  .seg { display: flex; background: var(--input); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); font-size: 16px; padding: 10px 4px; border-radius: 9px; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--seg-on-text); }
  [data-theme="night"] .seg button[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px #5d8fd6; }
  .seg.sm button { font-size: 15px; padding: 8px 2px; }
  .btns { display: flex; gap: 10px; }
  .btn { flex: 1; border: 1px solid var(--line); background: var(--btn); color: var(--text); font-size: 16px; font-weight: 600;
    padding: 12px; border-radius: 12px; letter-spacing: .5px; }
  .err { color: var(--warn); font-size: 14px; min-height: 18px; margin-top: 8px; }

  /* Rest bar */
  #viz { margin: 26px 0 14px; }
  .vbar { position: relative; }
  .vseg { display: flex; height: 26px; border-radius: 13px; overflow: hidden; }
  .vseg div { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; overflow: hidden; }
  .vcur { position: absolute; top: -4px; height: 34px; border-left: 2px solid var(--cur); margin-left: -1px; }
  .vtag { position: absolute; top: -26px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
    background: var(--cur); color: var(--tag-text); padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
  .vax { display: flex; justify-content: center; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--call); font-variant-numeric: tabular-nums; }
  .vax .ic { width: 14px; height: 14px; margin-left: 3px; }

  /* Rest table */
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 9px 0; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  tr.cur td { background: var(--hl); }
  tr.cur td:first-child { border-radius: 10px 0 0 10px; font-weight: 700; }
  tr.cur td:last-child { border-radius: 0 10px 10px 0; }
  td.k { white-space: nowrap; padding-left: 6px; }
  td.mid { text-align: center; white-space: nowrap; padding: 9px 6px; color: var(--muted); }
  td.v { text-align: right; font-weight: 700; font-size: 19px; padding-right: 6px; white-space: nowrap; }
  .sw { display: inline-block; width: 6px; height: 20px; border-radius: 3px; vertical-align: -4px; margin-right: 10px; }

  /* Calls */
  .call { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .call:last-of-type { border-bottom: 0; padding-bottom: 0; }
  .call .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .call .ct { font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; color: var(--call); }
  #calls .ic { color: var(--call-ic); }
  .call .ho { color: var(--muted); font-size: 14px; }
  .call .tm { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
  .call .tm b { color: var(--text); font-weight: 700; }
  .tbtn { border: 1px solid var(--call-ic); background: transparent; color: var(--call); font-size: 13px; font-weight: 700;
    letter-spacing: .5px; padding: 7px 12px; border-radius: 10px; white-space: nowrap; }
  .tbtn:disabled { opacity: .4; }
  .hidden { display: none !important; }
  .empty { color: var(--muted); font-size: 15px; text-align: center; padding: 8px 0; }

  @media (max-width: 380px) { h1 { font-size: 15px; letter-spacing: .3px; } }

  /* iPad / wide landscape: three columns, Now card across the top */
  @media (min-width: 900px) and (orientation: landscape) {
    body { font-size: 18px; }
    h1 { font-size: 24px; }
    .wrap { max-width: 1120px; grid-template-columns: 1fr 1fr 1fr; align-items: start; gap: 18px; }
    .now { grid-column: 1 / -1; padding: 12px 16px; }
    .now .l2 { font-size: 30px; }
    .card { padding: 20px; }
    .inbox input { font-size: 30px; }
  }
</style>
</head>
<body>
<header>
  <button type="button" id="kip" class="kip" aria-label="Kip the koala">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="14" cy="27" r="11" fill="#8e95a0"/><circle cx="14" cy="27" r="6" fill="#f3c6cf"/>
      <circle cx="50" cy="27" r="11" fill="#8e95a0"/><circle cx="50" cy="27" r="6" fill="#f3c6cf"/>
      <ellipse cx="32" cy="37" rx="20" ry="18" fill="#a7aeb8"/>
      <g class="k-eyes"><ellipse cx="25" cy="35" rx="2.3" ry="2.7" fill="#2b2f36"/><ellipse cx="39" cy="35" rx="2.3" ry="2.7" fill="#2b2f36"/></g>
      <ellipse cx="32" cy="43" rx="5" ry="6" fill="#2b2f36"/>
      <path class="k-m1" d="M28.5 51.5q3.5 2.2 7 0" stroke="#2b2f36" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path class="k-m2" d="M27 50.5q5 5 10 0" stroke="#2b2f36" stroke-width="1.8" fill="#e86f7f" stroke-linecap="round"/>
      <path d="M13 25q19-17 38 0l-2 4h-34z" fill="#1d3a6b"/><rect x="13" y="26" width="38" height="4.5" rx="2" fill="#0f2547"/>
      <circle cx="32" cy="18.5" r="2.6" fill="#f2b85a"/>
      <g class="k-arm"><path d="M4 66q1-13 13-17" stroke="#8e95a0" stroke-width="7" fill="none" stroke-linecap="round"/>
        <circle cx="17.5" cy="49" r="3.6" fill="#f2b85a" stroke="#2b2f36" stroke-width="1.2"/></g>
    </svg>
    <span class="kbub">CALL!</span>
  </button>
  <h1>CREW REST CALCULATOR</h1>
  <button type="button" class="theme" id="theme"></button>
</header>
<div class="wrap">
  <section class="now hidden" id="now" aria-live="polite">
    <div class="l1" id="vState"></div>
    <div class="l2 num" id="vLeft"></div>
    <div class="l3 num" id="vSub"></div>
  </section>

  <section class="card" id="inputs">
    <div class="field">
      <label class="f" for="to">TAKE OFF TIME UTC<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.639 10.258l4.83 -1.294a2 2 0 1 1 1.035 3.863l-14.489 3.883l-4.45 -5.02l2.897 -.776l2.45 1.414l2.897 -.776l-3.743 -6.244l2.898 -.777l5.675 5.727z"/><path d="M3 21h18"/></svg></label>
      <div class="inbox"><input id="to" inputmode="numeric" maxlength="5" placeholder="HH:MM" autocomplete="off"><span class="sfx">Z</span></div>
    </div>
    <div class="field">
      <label class="f" for="ft">FLIGHT TIME<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 7h11"/><path d="M6.5 17h11"/><path d="M6 20v-2a6 6 0 1 1 12 0v2a1 1 0 0 1 -1 1h-10a1 1 0 0 1 -1 -1z"/><path d="M6 4v2a6 6 0 1 0 12 0v-2a1 1 0 0 0 -1 -1h-10a1 1 0 0 0 -1 1z"/></svg></label>
      <div class="inbox"><input id="ft" inputmode="numeric" maxlength="5" placeholder="HH:MM" autocomplete="off"></div>
    </div>
    <div class="field">
      <label class="f">OPERATION</label>
      <div class="seg" id="op">
        <button type="button" data-n="2" aria-pressed="true">Double</button>
        <button type="button" data-n="3" aria-pressed="false">Augmented</button>
      </div>
    </div>
    <div class="btns"><button type="button" class="btn" id="clear">CLEAR</button></div>
    <div class="err" id="err"></div>
  </section>

  <section class="card" id="results">
    <h2>Rest<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h6l-6 8h6"/><path d="M14 4h6l-6 8h6"/></svg></h2>
    <div class="empty" id="rEmpty">Enter take off time and flight time</div>
    <div id="viz" class="hidden">
      <div class="vbar"><div class="vtag" id="vTag"></div><div class="vseg" id="vSeg"></div><div class="vcur" id="vCur"></div></div>
      <div class="vax"><span id="vNext"></span></div>
    </div>
    <table id="rTable" class="hidden"><tbody id="rBody"></tbody></table>
  </section>

  <section class="card" id="calls">
    <h2>Calls<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M12 10v3h2"/><path d="M7 4l-2.75 2"/><path d="M17 4l2.75 2"/></svg></h2>
    <div class="empty" id="cEmpty">No calls yet</div>
    <div id="cList"></div>
  </section>
</div>

<script>
(function () {
  "use strict";
  var SHORTCUT = "Crew Rest Timer";
  var LEADS = [0, 5, 10, 15];
  var ORD = ["1st", "2nd", "3rd"];
  var ALARM = "<svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><path d='M5 13a7 7 0 1 0 14 0a7 7 0 1 0 -14 0'/><path d='M12 10v3h2'/><path d='M7 4l-2.75 2'/><path d='M17 4l2.75 2'/></svg>";
  var MOON = "<svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><path d='M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z'/></svg>";
  var SUN = "<svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><path d='M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0'/><path d='M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7'/></svg>";
  var $ = function (id) { return document.getElementById(id); };
  var toEl = $("to"), ftEl = $("ft"), opEl = $("op");
  var state = { n: 2, leads: [0, 0, 0], plan: null };

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function z(ms) { var d = new Date(ms); return pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + "Z"; }
  function dur(min) { return Math.floor(min / 60) + "h " + pad(min % 60) + "m"; }

  // Pure calculation. toMin = take-off minutes after 0000Z, ftMin = flight minutes, n = number of rests.
  function calc(toMin, ftMin, n) {
    var total = ftMin - 90;
    if (total <= 0) return { error: "No rest: flight time must be more than 1h 30m" };
    var each = Math.floor(total / n), rests = [], s = toMin + 30;
    for (var i = 0; i < n; i++) {
      var len = i === n - 1 ? total - each * (n - 1) : each;
      rests.push({ start: s, end: s + len, len: len });
      s += len;
    }
    return { start: toMin + 30, end: toMin + 30 + total, total: total, rests: rests, eta: toMin + ftMin };
  }

  function parseTO(v) {
    var m = /^(\d{2}):(\d{2})$/.exec(v);
    if (!m) return null;
    return +m[1] < 24 && +m[2] < 60 ? +m[1] * 60 + +m[2] : null;
  }
  function parseFT(v) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(v);
    if (!m || +m[2] > 59) return null;
    return +m[1] * 60 + +m[2];
  }

  // Anchor take-off to a real date. Airborne or landed within 6 h: use that take-off.
  // Otherwise (pre-flight): use the next take-off after now.
  function anchor(toMin, ftMin, now) {
    var d = new Date(now);
    var base = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) + toMin * 60000;
    var c = [base - 864e5, base, base + 864e5];
    for (var i = 0; i < 3; i++) if (c[i] <= now && now < c[i] + (ftMin + 360) * 60000) return c[i];
    for (i = 0; i < 3; i++) if (c[i] > now) return c[i];
    return c[2];
  }

  function render() {
    var toV = toEl.value, ftV = ftEl.value, err = "";
    var toMin = parseTO(toV), ftMin = parseFT(ftV);
    state.plan = null;
    var td = toV.replace(/\D/g, "");
    var toBad = (td.length >= 2 && +td.slice(0, 2) > 23) || (td.length >= 3 && +td[2] > 5) || (toV.length === 5 && toMin === null);
    toEl.classList.toggle("bad", toBad);
    if (ftMin !== null && ftMin > 1200) ftMin = null;
    if (toBad) err = "Take off time: use HH:MM, 00:00 to 23:59";
    else if (ftV.length === 5 && ftMin === null) err = "Flight time: use HH:MM, max 20:00";
    var r = (toMin !== null && ftMin !== null) ? calc(toMin, ftMin, state.n) : null;
    if (r && r.error) { err = r.error; r = null; }
    $("err").textContent = err;
    save();
    if (window.CR && CR.kipState) setTimeout(CR.kipState, 0);

    if (!r) {
      $("rTable").classList.add("hidden"); $("viz").classList.add("hidden"); $("now").classList.add("hidden");
      $("rEmpty").classList.remove("hidden");
      $("cList").innerHTML = ""; $("cEmpty").classList.remove("hidden");
      return;
    }
    var t0 = anchor(toMin, ftMin, Date.now()) - toMin * 60000; // 0000Z of take-off day
    var ms = function (min) { return t0 + min * 60000; };
    state.plan = { r: r, ms: ms, toMin: toMin };

    // Rest table: colour key strip matches the bar
    var rows = ["<tr><td class='k'><span class='sw' style='background:transparent'></span>Total rest</td><td class='mid'>" + z(ms(r.start)) + "–" + z(ms(r.end)) +
      "</td><td class='v'>" + dur(r.total) + "</td></tr>"];
    r.rests.forEach(function (x, i) {
      rows.push("<tr data-i='" + i + "'><td class='k'><span class='sw' style='background:var(--r" + (i + 1) + ")'></span>" + ORD[i] +
        " rest</td><td class='mid'>" + z(ms(x.start)) + "–" + z(ms(x.end)) + "</td><td class='v'>" + dur(x.len) + "</td></tr>");
    });
    rows.push("<tr><td class='k'><span class='sw' style='background:transparent'></span>ETA</td><td class='mid'></td><td class='v'>" + z(ms(r.eta)) + "</td></tr>");
    $("rBody").innerHTML = rows.join("");
    $("rTable").classList.remove("hidden"); $("rEmpty").classList.add("hidden");

    // Bar: grey = no rest; rests labelled inside
    $("viz").classList.remove("hidden");
    var segs = [["pp", 30, ""]].concat(r.rests.map(function (x, i) { return ["r" + (i + 1), x.len, ORD[i]]; })).concat([["pp", 60, ""]]);
    $("vSeg").innerHTML = segs.map(function (g) {
      return "<div style='width:" + (g[1] / ftMin * 100) + "%;background:var(--" + g[0] + ");color:var(--" + g[0] + "t)'>" + g[2] + "</div>";
    }).join("");

    $("cList").innerHTML = r.rests.map(function (x, i) {
      var segs = LEADS.map(function (l) {
        return "<button type='button' data-i='" + i + "' data-l='" + l + "' aria-pressed='" + (state.leads[i] === l) + "'>" +
          (l === 0 ? "At" : "−" + l) + "</button>";
      }).join("");
      return "<div class='call' data-i='" + i + "'><div class='top'><span>End " + ORD[i] + " rest" + ALARM + " <span class='ho'>" +
        z(ms(x.end)) + "</span></span><span class='ct' id='ct" + i + "'>" + z(ms(x.end - state.leads[i])) + "</span></div>" +
        "<div class='tm'><span>Clock timer <b id='tm" + i + "'></b></span>" +
        "<button type='button' class='tbtn' id='tb" + i + "' data-i='" + i + "'>START TIMER</button></div>" +
        "<div class='seg sm'>" + segs + "</div></div>";
    }).join("");
    $("cEmpty").classList.add("hidden");
    tick();
  }

  // Live view: Now card, current-time line and tag, current rest row, call markers, timers.
  function tick() {
    var p = state.plan; if (!p) return;
    var r = p.r, now = Date.now();
    var t0 = p.ms(p.toMin), t1 = p.ms(r.eta), span = t1 - t0;
    var mins = function (t) { return Math.ceil((t - now) / 60000); };
    var l1 = "", l2 = "", l3 = "", ci = -1, i;
    if (now < t0) { l1 = "1st rest starts in"; l2 = dur(mins(p.ms(r.start))); l3 = "at " + z(p.ms(r.start)); }
    else if (now < p.ms(r.start)) { l1 = "1st rest starts in"; l2 = dur(mins(p.ms(r.start))); l3 = "at " + z(p.ms(r.start)); }
    else if (now < p.ms(r.end)) {
      for (i = 0; i < r.rests.length; i++) if (now < p.ms(r.rests[i].end)) break;
      ci = i;
      l1 = ORD[i] + " rest now"; l2 = dur(mins(p.ms(r.rests[i].end))) + " left"; l3 = "ends " + z(p.ms(r.rests[i].end));
    }
    else if (now < t1) { l1 = "Rest complete"; l2 = dur(mins(t1)) + " to ETA"; l3 = "ETA " + z(t1); }
    else { l1 = "Flight complete"; l2 = ""; l3 = "ETA " + z(t1); }
    $("now").classList.remove("hidden");
    $("vState").textContent = l1; $("vLeft").textContent = l2; $("vSub").textContent = l3;
    $("vLeft").style.display = l2 ? "" : "none";

    [].forEach.call(document.querySelectorAll("#rBody tr[data-i]"), function (tr) {
      tr.classList.toggle("cur", +tr.dataset.i === ci);
    });

    var inFlight = now >= t0 && now < t1;
    var pct = Math.max(0, Math.min(100, (now - t0) / span * 100));
    var cur = $("vCur"), tag = $("vTag");
    cur.style.display = inFlight ? "" : "none";
    cur.style.left = pct + "%";
    tag.style.display = now < t1 ? "" : "none";
    tag.style.left = pct + "%";
    tag.style.transform = "translateX(-" + pct + "%)";
    tag.textContent = z(now);

    var next = null;
    r.rests.forEach(function (x, k) {
      var t = p.ms(x.end - state.leads[k]);
      if (t > now && (next === null || t < next)) next = t;
      var tm = $("tm" + k), tb = $("tb" + k);
      if (tm) tm.textContent = t > now ? dur(Math.floor((t - now) / 60000)) : "Passed";
      if (tb) tb.disabled = t <= now;
    });
    $("vNext").innerHTML = next === null ? "No more calls" : "Next call " + z(next) + ALARM;
    if (window.CR && CR.kipState) CR.kipState();
  }
  setInterval(tick, 30000);

  // Kip: idle blink/smile; watch glance from 10 min before the next call; CALL! from the call time until tapped.
  var kip = $("kip"), reduce = matchMedia("(prefers-reduced-motion: reduce)");
  var acked = [];
  try { acked = JSON.parse(localStorage.getItem("crAck") || "[]"); } catch (e) {}
  function callTimes() {
    var p = state.plan; if (!p) return [];
    return p.r.rests.map(function (x, k) { return p.ms(x.end - state.leads[k]); });
  }
  function kipState() {
    var now = Date.now(), ts = callTimes(), due = null, soon = false;
    ts.forEach(function (t) {
      // A call is due from its time until tapped (only calls reached in the last 60 min, so entering a flight late doesn't fire old calls)
      if (t <= now && now - t < 3600000 && acked.indexOf(t) < 0 && (due === null || t > due)) due = t;
      if (t > now && t - now <= 600000) soon = true;
    });
    kip.dataset.due = due === null ? "" : due;
    kip.classList.toggle("k-call", due !== null);
    kip.classList.toggle("k-watch", due === null && soon);
    kip.setAttribute("aria-label", due !== null ? "Kip: call now. Tap to dismiss" : "Kip the koala");
  }
  kip.addEventListener("click", function () {
    if (kip.dataset.due) {
      acked.push(+kip.dataset.due); acked = acked.slice(-20);
      try { localStorage.setItem("crAck", JSON.stringify(acked)); } catch (e) {}
      kipState();
    }
    smile(1500);
  });
  function smile(ms) { kip.classList.add("smile"); setTimeout(function () { kip.classList.remove("smile"); }, ms); }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  (function blinkLoop() {
    setTimeout(function () {
      if (!reduce.matches && !document.hidden) { kip.classList.add("blink"); setTimeout(function () { kip.classList.remove("blink"); }, 140); }
      blinkLoop();
    }, rnd(4000, 7000));
  })();
  (function smileLoop() {
    setTimeout(function () { if (!reduce.matches && !document.hidden) smile(2000); smileLoop(); }, rnd(15000, 25000));
  })();
  setInterval(kipState, 5000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) render(); });

  // HH:MM inputs: colon auto-inserted while typing.
  // Single-digit hours: if the digits typed can't start a valid hour, a leading 0 is added.
  // Take-off (max 23 h): 500 -> 05:00, 245 -> 02:45. Flight time (max 20 h): 900 -> 09:00.
  function colon(el, maxH) {
    var tens = Math.floor(maxH / 10), units = maxH % 10;
    el.addEventListener("input", function (e) {
      var d = el.value.replace(/\D/g, "");
      if (e.inputType !== "deleteContentBackward" && d.length && d[0] !== "0" &&
          (+d[0] > tens || (+d[0] === tens && d.length > 1 && +d[1] > units))) d = "0" + d;
      d = d.slice(0, 4);
      if (e.inputType === "deleteContentBackward" && d.length === 2) el.value = d;
      else el.value = d.length > 2 ? d.slice(0, 2) + ":" + d.slice(2) : (d.length === 2 ? d + ":" : d);
      render();
    });
  }
  colon(toEl, 23); colon(ftEl, 20);
  opEl.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.n = +b.dataset.n;
    [].forEach.call(opEl.children, function (c) { c.setAttribute("aria-pressed", c === b); });
    render();
  });
  $("cList").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.classList.contains("tbtn")) { startTimer(+b.dataset.i); return; }
    state.leads[+b.dataset.i] = +b.dataset.l;
    render();
  });
  $("clear").addEventListener("click", function () {
    toEl.value = ""; ftEl.value = ""; state.n = 2; state.leads = [0, 0, 0];
    [].forEach.call(opEl.children, function (c, i) { c.setAttribute("aria-pressed", i === 0); });
    render();
  });

  // Start the iOS Clock timer through the "Crew Rest Timer" Shortcut (input = seconds until the call).
  function startTimer(k) {
    var p = state.plan; if (!p) return;
    var sec = Math.round((p.ms(p.r.rests[k].end - state.leads[k]) - Date.now()) / 1000);
    if (sec <= 0) { render(); return; }
    CR.launch("shortcuts://run-shortcut?name=" + encodeURIComponent(SHORTCUT) + "&input=text&text=" + sec);
  }

  // Remember inputs on this device, so a closed or reloaded app keeps the flight.
  function save() {
    try { localStorage.setItem("crState", JSON.stringify({ to: toEl.value, ft: ftEl.value, n: state.n, leads: state.leads })); } catch (e) {}
  }
  function restore() {
    try {
      var d = JSON.parse(localStorage.getItem("crState") || "null"); if (!d) return;
      toEl.value = d.to || ""; ftEl.value = d.ft || "";
      state.n = d.n === 3 ? 3 : 2;
      if (Array.isArray(d.leads)) state.leads = d.leads.map(function (l) { return LEADS.indexOf(l) >= 0 ? l : 0; }).concat([0, 0, 0]).slice(0, 3);
      [].forEach.call(opEl.children, function (c) { c.setAttribute("aria-pressed", +c.dataset.n === state.n); });
    } catch (e) {}
  }

  // Day / night colours. Saved on this device; first launch follows the phone's dark setting.
  var themeBtn = $("theme");
  function setTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    themeBtn.innerHTML = t === "night" ? SUN : MOON;
    themeBtn.setAttribute("aria-label", t === "night" ? "Switch to day colours" : "Switch to night colours");
    document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "night" ? "#0f1216" : "#eef2f6");
    try { localStorage.setItem("crTheme", t); } catch (e) {}
  }
  themeBtn.addEventListener("click", function () {
    setTheme(document.documentElement.getAttribute("data-theme") === "night" ? "day" : "night");
  });
  var saved = null;
  try { saved = localStorage.getItem("crTheme"); } catch (e) {}
  setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day"));

  window.CR = { calc: calc, anchor: anchor, state: state, render: render, tick: tick, kipState: kipState,
    launch: function (url) { window.location.href = url; } };

  if ("serviceWorker" in navigator && window.isSecureContext) {
    navigator.serviceWorker.register("sw.js");
  }
  restore();
  render();
})();
</script>
</body>
</html>
