<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Crew Rest">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Crew Rest Calculator</title>
<style>
  /* Day: positive polarity (dark on light) for bright flight deck. Night: negative polarity,
     dark navy background, soft blue-white text, same blue scheme as day, dimmed (moderate contrast, less glare). */
  :root, [data-theme="day"] {
    --bg: #e9edf1; --card: #ffffff; --line: #c3ccd5; --text: #0b0f14; --muted: #46515c;
    --input: #f4f6f8; --btn: #e3e8ee; --accent: #0b57d0; --on-accent: #ffffff;
    --seg-on: #0b57d0; --seg-on-text: #ffffff; --warn: #b3261e;
    --r1: #85b7eb; --r2: #378add; --r3: #185fa5; --pp: #cfd6de; --cur: #0b0f14; --tag-text: #ffffff;
  }
  [data-theme="night"] {
    --bg: #0a0f1a; --card: #111827; --line: #243247; --text: #d5deea; --muted: #8e9cb1;
    --input: #0a0f1a; --btn: #1a2436; --accent: #1f4f96; --on-accent: #e6eefb;
    --seg-on: #1f4f96; --seg-on-text: #e6eefb; --warn: #f08a7a;
    --r1: #4a78b8; --r2: #345f9c; --r3: #22487e; --pp: #223047; --cur: #e6eefb; --tag-text: #0a0f1a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 14px)
    calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 14px); }
  header { position: relative; padding: 0 62px; }
  .theme { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 58px; padding: 6px 0;
    font-size: 12px; font-weight: 700; letter-spacing: .5px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--btn); color: var(--text); }
  h1 { text-align: center; font-size: 17px; letter-spacing: .5px; white-space: nowrap; margin: 4px 0 14px; font-weight: 700; }
  .wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .card h2 { font-size: 13px; letter-spacing: .8px; color: var(--muted); margin: 0 0 10px; font-weight: 600; text-transform: uppercase; }
  .ic { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.28em; margin-left: 6px; flex: none; }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; letter-spacing: .5px; }
  .field { margin-bottom: 14px; }
  .inbox { position: relative; }
  .inbox input { width: 100%; font-size: 26px; font-variant-numeric: tabular-nums; padding: 10px 40px 10px 12px;
    background: var(--input); color: var(--text); border: 1px solid var(--line); border-radius: 10px; outline: none; }
  .inbox input:focus { border-color: var(--accent); }
  .inbox .sfx { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 22px; color: var(--muted); pointer-events: none; }
  .seg { display: flex; background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); font-size: 16px; padding: 10px 4px; border-radius: 8px; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--seg-on-text); }
  [data-theme="night"] .seg button[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px #5d8fd6; }
  .seg.sm button { font-size: 15px; padding: 8px 2px; }
  .btns { display: flex; gap: 10px; }
  .btn { flex: 1; border: 1px solid var(--line); background: var(--btn); color: var(--text); font-size: 16px; font-weight: 600;
    padding: 12px; border-radius: 10px; letter-spacing: .5px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn:disabled { opacity: .45; }
  .err { color: var(--warn); font-size: 14px; min-height: 18px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 8px 0; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  td.v { text-align: right; font-weight: 600; font-size: 18px; }
  td.mid { text-align: center; white-space: nowrap; padding: 8px 6px; }
  #viz { margin-bottom: 14px; }
  .vnow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 30px; }
  .vnow .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .vbar { position: relative; }
  .vseg { display: flex; height: 18px; border-radius: 9px; overflow: hidden; }
  .vseg div { height: 100%; }
  .vcur { position: absolute; top: -4px; height: 26px; border-left: 2px solid var(--cur); margin-left: -1px; }
  .vtag { position: absolute; top: -26px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
    background: var(--cur); color: var(--tag-text); padding: 1px 6px; border-radius: 5px; white-space: nowrap; }
  .vmk { position: relative; height: 18px; margin-top: 3px; color: var(--muted); }
  .vmk .ic { position: absolute; width: 15px; height: 15px; margin: 0; transform: translateX(-50%); }
  .vax { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .vax .ic { width: 14px; height: 14px; margin-left: 3px; }
  .call { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .call:last-of-type { border-bottom: 0; }
  .call .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .call .tm { display: flex; justify-content: space-between; color: var(--muted); font-size: 15px; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .call .tm .tv { font-weight: 700; color: var(--text); }
  .call .ct { font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
  .call .ho { color: var(--muted); font-size: 14px; }
  .hidden { display: none !important; }
  .empty { color: var(--muted); font-size: 15px; text-align: center; padding: 8px 0; }

  @media (max-width: 380px) { h1 { font-size: 15px; letter-spacing: .3px; } }

  /* iPad / wide landscape: three columns */
  @media (min-width: 900px) and (orientation: landscape) {
    body { font-size: 18px; }
    h1 { font-size: 24px; margin-bottom: 18px; }
    .wrap { max-width: 1100px; grid-template-columns: 1fr 1fr 1fr; align-items: start; gap: 16px; }
    .card { padding: 18px; }
    .inbox input { font-size: 30px; }
  }
</style>
</head>
<body>
<header><h1>CREW REST CALCULATOR</h1><button type="button" class="theme" id="theme" aria-label="Switch day or night colours">NIGHT</button></header>
<div class="wrap">
  <section class="card" id="inputs">
    <div class="field">
      <label class="f" for="to">TAKE OFF TIME UTC<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.639 10.258l4.83 -1.294a2 2 0 1 1 1.035 3.863l-14.489 3.883l-4.45 -5.02l2.897 -.776l2.45 1.414l2.897 -.776l-3.743 -6.244l2.898 -.777l5.675 5.727z"/><path d="M3 21h18"/></svg></label>
      <div class="inbox"><input id="to" inputmode="numeric" maxlength="5" placeholder="HH:MM" autocomplete="off"><span class="sfx">Z</span></div>
    </div>
    <div class="field">
      <label class="f" for="ft">FLIGHT TIME<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 7h11"/><path d="M6.5 17h11"/><path d="M6 20v-2a6 6 0 1 1 12 0v2a1 1 0 0 1 -1 1h-10a1 1 0 0 1 -1 -1z"/><path d="M6 4v2a6 6 0 1 0 12 0v-2a1 1 0 0 0 -1 -1h-10a1 1 0 0 0 -1 1z"/></svg></label>
      <div class="inbox"><input id="ft" inputmode="numeric" maxlength="5" placeholder="HH:MM" autocomplete="off"></div>
    </div>
    <div class="field">
      <label class="f">OPERATION</label>
      <div class="seg" id="op">
        <button type="button" data-n="2" aria-pressed="true">Double</button>
        <button type="button" data-n="3" aria-pressed="false">Augmented</button>
      </div>
    </div>
    <div class="btns"><button type="button" class="btn" id="clear">CLEAR</button></div>
    <div class="err" id="err"></div>
  </section>

  <section class="card" id="results">
    <h2>Rest<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h6l-6 8h6"/><path d="M14 4h6l-6 8h6"/></svg></h2>
    <div class="empty" id="rEmpty">Enter take off time and flight time</div>
    <div id="viz" class="hidden">
      <div class="vnow"><span id="vState"></span><span class="big" id="vLeft"></span></div>
      <div class="vbar"><div class="vtag" id="vTag"></div><div class="vseg" id="vSeg"></div><div class="vcur" id="vCur"></div></div>
      <div class="vmk" id="vMk"></div>
      <div class="vax"><span id="vTo"></span><span id="vNext"></span><span id="vEta"></span></div>
    </div>
    <table id="rTable" class="hidden"><tbody id="rBody"></tbody></table>
  </section>

  <section class="card" id="calls">
    <h2>Calls<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M12 10v3h2"/><path d="M7 4l-2.75 2"/><path d="M17 4l2.75 2"/></svg></h2>
    <div class="empty" id="cEmpty">No calls yet</div>
    <div id="cList"></div>
  </section>
</div>

<script>
(function () {
  "use strict";
  var LEADS = [0, 5, 10, 15];
  var ORD = ["1st", "2nd", "3rd"];
  var $ = function (id) { return document.getElementById(id); };
  var toEl = $("to"), ftEl = $("ft"), opEl = $("op");
  var state = { n: 2, leads: [0, 0, 0], plan: null };

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function z(ms) { var d = new Date(ms); return pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + "Z"; }
  function dur(min) { return Math.floor(min / 60) + "h " + pad(min % 60) + "m"; }

  // Pure calculation. toMin = take-off minutes after 0000Z, ftMin = flight minutes, n = number of rests.
  function calc(toMin, ftMin, n) {
    var total = ftMin - 90;
    if (total <= 0) return { error: "No rest: flight time must be more than 1h 30m" };
    var each = Math.floor(total / n), rests = [], s = toMin + 30;
    for (var i = 0; i < n; i++) {
      var len = i === n - 1 ? total - each * (n - 1) : each;
      rests.push({ start: s, end: s + len, len: len });
      s += len;
    }
    return { start: toMin + 30, end: toMin + 30 + total, total: total, rests: rests, eta: toMin + ftMin };
  }

  function parseTO(v) {
    var m = /^(\d{2}):(\d{2})$/.exec(v);
    if (!m) return null;
    return +m[1] < 24 && +m[2] < 60 ? +m[1] * 60 + +m[2] : null;
  }
  function parseFT(v) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(v);
    if (!m || +m[2] > 59) return null;
    return +m[1] * 60 + +m[2];
  }

  // Anchor take-off to a real date. Airborne or landed within 6 h: use that take-off.
  // Otherwise (pre-flight): use the next take-off after now.
  function anchor(toMin, ftMin, now) {
    var d = new Date(now);
    var base = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) + toMin * 60000;
    var c = [base - 864e5, base, base + 864e5];
    for (var i = 0; i < 3; i++) if (c[i] <= now && now < c[i] + (ftMin + 360) * 60000) return c[i];
    for (i = 0; i < 3; i++) if (c[i] > now) return c[i];
    return c[2];
  }

  function render() {
    var toV = toEl.value, ftV = ftEl.value, err = "";
    var toMin = parseTO(toV), ftMin = parseFT(ftV);
    state.plan = null;
    if (toV.length === 5 && toMin === null) err = "Take off time: use HH:MM, 00:00 to 23:59";
    else if (ftV.length === 5 && ftMin === null) err = "Flight time: use HH:MM, minutes 00 to 59";
    var r = (toMin !== null && ftMin !== null) ? calc(toMin, ftMin, state.n) : null;
    if (r && r.error) { err = r.error; r = null; }
    $("err").textContent = err;

    if (!r) {
      $("rTable").classList.add("hidden"); $("viz").classList.add("hidden"); $("rEmpty").classList.remove("hidden");
      $("cList").innerHTML = ""; $("cEmpty").classList.remove("hidden");
      return;
    }
    var t0 = anchor(toMin, ftMin, Date.now()) - toMin * 60000; // 0000Z of take-off day
    var ms = function (min) { return t0 + min * 60000; };
    state.plan = { r: r, ms: ms };

    var rows = [["Total rest", dur(r.total), z(ms(r.start)) + "–" + z(ms(r.end))]];
    r.rests.forEach(function (x, i) {
      rows.push([ORD[i] + " rest", dur(x.len), z(ms(x.start)) + "–" + z(ms(x.end))]);
    });
    rows.push(["ETA", z(ms(r.eta)), ""]);
    $("rBody").innerHTML = rows.map(function (w) {
      return "<tr><td>" + w[0] + "</td><td class='mid'>" + w[2] + "</td><td class='v'>" + w[1] + "</td></tr>";
    }).join("");
    $("rTable").classList.remove("hidden"); $("rEmpty").classList.add("hidden");
    $("viz").classList.remove("hidden");
    var span = ftMin;
    var segs = [["pp", 30]].concat(r.rests.map(function (x, i) { return ["r" + (i + 1), x.len]; })).concat([["pp", 60]]);
    $("vSeg").innerHTML = segs.map(function (g) {
      return "<div style='width:" + (g[1] / span * 100) + "%;background:var(--" + g[0] + ")'></div>";
    }).join("");
    $("vTo").textContent = "T/O " + z(ms(toMin));
    $("vEta").textContent = "ETA " + z(ms(r.eta));
    state.plan.toMin = toMin;

    $("cList").innerHTML = r.rests.map(function (x, i) {
      var segs = LEADS.map(function (l) {
        return "<button type='button' data-i='" + i + "' data-l='" + l + "' aria-pressed='" + (state.leads[i] === l) + "'>" +
          (l === 0 ? "At" : "−" + l) + "</button>";
      }).join("");
      return "<div class='call' data-i='" + i + "'><div class='top'><span>End " + ORD[i] + " rest<svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><path d='M5 13a7 7 0 1 0 14 0a7 7 0 1 0 -14 0'/><path d='M12 10v3h2'/><path d='M7 4l-2.75 2'/><path d='M17 4l2.75 2'/></svg> <span class='ho'>" +
        z(ms(x.end)) + "</span></span><span class='ct' id='ct" + i + "'>" + z(ms(x.end - state.leads[i])) +
        "</span></div><div class='tm'><span>Clock timer</span><span class='tv' id='tm" + i + "'></span></div>" +
        "<div class='seg sm'>" + segs + "</div></div>";
    }).join("");
    $("cEmpty").classList.add("hidden");
    tick();
  }

  // Live "now" view: state line, countdown, current-time line and tag, call markers, next call.
  var ALARM = "<svg class='ic' viewBox='0 0 24 24' aria-hidden='true'><path d='M5 13a7 7 0 1 0 14 0a7 7 0 1 0 -14 0'/><path d='M12 10v3h2'/><path d='M7 4l-2.75 2'/><path d='M17 4l2.75 2'/></svg>";
  function tick() {
    var p = state.plan; if (!p) return;
    var r = p.r, now = Date.now();
    var t0 = p.ms(p.toMin), t1 = p.ms(r.eta), span = t1 - t0;
    var mins = function (t) { return Math.ceil((t - now) / 60000); };
    var st = "", left = "", i;
    if (now < t0) { st = "1st rest starts " + z(p.ms(r.start)); left = "in " + dur(mins(p.ms(r.start))); }
    else if (now < p.ms(r.start)) { st = "1st rest in"; left = dur(mins(p.ms(r.start))); }
    else if (now < p.ms(r.end)) {
      for (i = 0; i < r.rests.length; i++) if (now < p.ms(r.rests[i].end)) break;
      st = ORD[i] + " rest now"; left = dur(mins(p.ms(r.rests[i].end))) + " left";
    }
    else if (now < t1) { st = "Rest complete"; left = "ETA in " + dur(mins(t1)); }
    else { st = "Flight complete"; left = ""; }
    $("vState").textContent = st; $("vLeft").textContent = left;

    var inFlight = now >= t0 && now < t1;
    var pct = Math.max(0, Math.min(100, (now - t0) / span * 100));
    var cur = $("vCur"), tag = $("vTag");
    cur.style.display = inFlight ? "" : "none";
    cur.style.left = pct + "%";
    tag.style.display = now < t1 ? "" : "none";
    tag.style.left = pct + "%";
    tag.style.transform = "translateX(-" + pct + "%)";
    tag.textContent = z(now);

    var next = null;
    $("vMk").innerHTML = r.rests.map(function (x, k) {
      var t = p.ms(x.end - state.leads[k]);
      if (t > now && (next === null || t < next)) next = t;
      var tm = $("tm" + k);
      if (tm) tm.textContent = t > now ? dur(Math.floor((t - now) / 60000)) : "Passed";
      return ALARM.replace("class='ic'", "class='ic' style='left:" + ((t - t0) / span * 100) + "%'");
    }).join("");
    $("vNext").innerHTML = next === null ? "No more calls" : "Next call " + z(next) + ALARM;
  }
  setInterval(tick, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) render(); });

  // Input formatting
  // HH:MM inputs: colon auto-inserted while typing.
  function colon(el) {
    el.addEventListener("input", function (e) {
      var d = el.value.replace(/\D/g, "").slice(0, 4);
      if (e.inputType === "deleteContentBackward" && d.length === 2) el.value = d;
      else el.value = d.length > 2 ? d.slice(0, 2) + ":" + d.slice(2) : (d.length === 2 ? d + ":" : d);
      render();
    });
  }
  colon(toEl); colon(ftEl);
  opEl.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.n = +b.dataset.n;
    [].forEach.call(opEl.children, function (c) { c.setAttribute("aria-pressed", c === b); });
    render();
  });
  $("cList").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.leads[+b.dataset.i] = +b.dataset.l;
    render();
  });
  $("clear").addEventListener("click", function () {
    toEl.value = ""; ftEl.value = ""; state.n = 2; state.leads = [0, 0, 0];
    [].forEach.call(opEl.children, function (c, i) { c.setAttribute("aria-pressed", i === 0); });
    render();
  });

  // Day / night colours. Saved on this device; first launch follows the phone's dark setting.
  var themeBtn = $("theme");
  function setTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    themeBtn.textContent = t === "night" ? "DAY" : "NIGHT";
    document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "night" ? "#0a0f1a" : "#e9edf1");
    try { localStorage.setItem("crTheme", t); } catch (e) {}
  }
  themeBtn.addEventListener("click", function () {
    setTheme(document.documentElement.getAttribute("data-theme") === "night" ? "day" : "night");
  });
  var saved = null;
  try { saved = localStorage.getItem("crTheme"); } catch (e) {}
  setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day"));

  window.CR = { calc: calc, anchor: anchor, state: state, render: render, tick: tick };

  if ("serviceWorker" in navigator && window.isSecureContext) {
    navigator.serviceWorker.register("sw.js");
  }
  render();
})();
</script>
</body>
</html>
